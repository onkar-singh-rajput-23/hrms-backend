# Render Blueprint for the HRMS backend (Express + MongoDB Atlas).
# In Render: New → Blueprint → connect this repo, or set these manually on a Web Service.
services:
  - type: web
    name: hrms-backend
    runtime: node
    plan: free
    region: singapore # closest Render region to India; change if you prefer
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI # set in the Render dashboard (your Atlas SRV string) — do NOT commit it
        sync: false
      - key: JWT_SECRET # set in the Render dashboard (a long random string)
        sync: false
      - key: CORS_ORIGIN # your deployed frontend origin; "*" allows any
        value: "*"
      - key: JWT_EXPIRES_IN
        value: 7d
